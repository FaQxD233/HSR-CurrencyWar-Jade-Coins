name: 打包 exe

# 推送 v 开头的标签时打包并发布 Release。
# 也可以在 Actions 页面手动运行：填了版本号就在打包、自检都通过后创建对应标签和 Release，不填只生成构建产物。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "发布的版本号，如 1.0.0；留空只生成构建产物"
        required: false
        default: ""

permissions:
  contents: write  # 发布 Release 需要写权限

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      EXE_NAME: HSR-CurrencyWar-Jade-Coins.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka zstandard ordered-set

      - name: 版本号
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:REF_TYPE -eq "tag") { $env:REF_NAME.TrimStart("v") } elseif ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { "0.0.0" }
          if ($version -notmatch '^\d+(\.\d+){0,3}$') { throw "版本号格式不对：$version（应为 1.0.0 这样的数字）" }
          $release = if ($env:REF_TYPE -eq "tag" -or $env:INPUT_VERSION) { "true" } else { "false" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE=$release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Nuitka 打包
        run: >
          python -m nuitka app.py
          --onefile
          --windows-console-mode=disable
          --windows-uac-admin
          --enable-plugin=tk-inter
          --include-data-dir=assets=assets
          --include-package-data=rapidocr_onnxruntime
          --windows-icon-from-ico=assets/app.ico
          --company-name=FaQxD233
          --product-name=HSR-CurrencyWar-Jade-Coins
          --file-description="HSR Currency War Jade Coins"
          --file-version=${{ env.VERSION }}
          --product-version=${{ env.VERSION }}
          --onefile-tempdir-spec="{CACHE_DIR}/{COMPANY}/{PRODUCT}/{VERSION}"
          --output-dir=build
          --output-filename=${{ env.EXE_NAME }}
          --assume-yes-for-downloads

      - name: 自检（导入全部模块、识别一次、创建一次窗口）
        timeout-minutes: 5
        run: |
          $process = Start-Process -FilePath "build\$env:EXE_NAME" -ArgumentList "--self-check" -PassThru -Wait
          Get-Content -Path "build\self-check.log" -Encoding utf8 -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "自检失败，退出码 $($process.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: HSR-CurrencyWar-Jade-Coins
          path: build/${{ env.EXE_NAME }}

      - name: 发布 Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: build/${{ env.EXE_NAME }}
          generate_release_notes: true
